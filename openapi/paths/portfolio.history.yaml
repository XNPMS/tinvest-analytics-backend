get:
  tags:
    - Dashboard
  summary: История стоимости портфеля по одному счёту
  operationId: getPortfolioHistory
  description: >
    Возвращает дневные снэпшоты стоимости портфеля по выбранному счёту за период.

    `period=0` означает всё время с даты открытия счёта.
    По умолчанию — последние 30 дней.

    Возвращает `204 No Content` если для счёта нет снэпшотов за указанный период.
  security:
    - cookieAuth: []
  parameters:
    - name: account_id
      in: query
      required: true
      description: DB ID счёта из таблицы `tinvest_accounts` (числовой, не Tinkoff string ID)
      schema:
        type: integer
        minimum: 1
      example: 42
    - name: period
      in: query
      required: false
      description: >
        Количество дней от сегодня назад. `0` — с даты открытия счёта.
        Допустимый диапазон: 0–3650.
      schema:
        type: integer
        minimum: 0
        maximum: 3650
        default: 30
      example: 90
  responses:
    "200":
      description: История снэпшотов и сводка по периоду.
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/PortfolioHistoryResponse"
          example:
            data:
              - date: "2024-01-01"
                total_value_rub: 1000000.00
                cash_flow_rub: 50000.00
                twr_factor: 1.0
              - date: "2024-01-02"
                total_value_rub: 1012000.00
                cash_flow_rub: 0.00
                twr_factor: 1.012
            summary:
              twr_percent: 1.20
              first_value: 1000000.00
              last_value: 1012000.00
    "204":
      description: Нет снэпшотов за указанный период.
    "400":
      description: Невалидные параметры или счёт не найден / не принадлежит пользователю.
      content:
        application/problem+json:
          schema:
            $ref: "../components/schemas.yaml#/ProblemDetails"
          example:
            status: 400
            detail: "Account not found"
    "401":
      $ref: "../components/responses.yaml#/Unauthorized"
