version: '3.8'

x-php-tmpl: &php-tmpl
  build:
    context: .
    dockerfile: Dockerfile
  image: tinvest-analytics-backend:latest
  restart: always
  tty: true
  working_dir: /var/www/application
  env_file:
    - .env
  volumes:
    - .:/var/www/application
    - ./docker/php/conf.d/dev.ini:/usr/local/etc/php/conf.d/dev.ini

services:
  # PHP FPM Backend
  tinvest-analytics-backend:
    <<: *php-tmpl
    container_name: tinvest-analytics-backend

  # Nginx Service
  tinvest-analytics-nginx:
    image: nginx:alpine
    container_name: tinvest-analytics-nginx
    restart: always
    tty: true
    environment:
      - "APPLICATION_UPSTREAM=tinvest-analytics-backend:9000"
    volumes:
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./docker/nginx/templates/:/etc/nginx/templates/
      - ./public/:/var/www/application/public/
    ports:
      - '9000:9000'
      - '443:443'

  # MySQL Service
  tinvest-analytics-mysql:
    image: library/mysql:8.0
    container_name: tinvest-analytics-mysql
    restart: always
    tty: true
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      SERVICE_NAME: mysql
    volumes:
      - applicationMysqlData:/var/lib/mysql
      - applicationMysqlFiles:/var/lib/mysql-files

  # RabbitMQ Service
  tinvest-analytics-rabbitmq:
   image: rabbitmq:3.11-management
   container_name: tinvest-analytics-rabbitmq
   restart: always
   tty: true
   ports:
      - '5672:5672'
      - '15672:15672'
   environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
   healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Memcached Service
  tinvest-analytics-memcached:
    image: memcached:1.6-alpine
    container_name: tinvest-analytics-memcached
    restart: always
    tty: true
    ports:
      - '11211:11211'
    environment:
      SERVICE_NAME: memcached

  # WebSocket Server
  tinvest-analytics-websocket:
    <<: *php-tmpl
    container_name: tinvest-analytics-websocket
    ports:
      - '${WS_PORT:-8081}:${WS_PORT:-8081}'
    command: ["php", "vendor/bin/laminas", "websocket:server"]

  # Worker Service
  tinvest-analytic-sync-onboarding-accounts:
    <<: *php-tmpl
    container_name: tinvest-analytic-sync-onboarding-accounts
    depends_on:
      tinvest-analytics-rabbitmq:
        condition: service_healthy
    command: [
        "php",
        "vendor/bin/laminas",
        "system:queue:worker",
        "--queue",
        "sync.onboarding.accounts",
        "--max-retries=3",
        "--retry-delay=60",
        "--save-failure"
    ]

# Docker Volumes
volumes:
  applicationMysqlData:
    driver: local
  applicationMysqlFiles:
    driver: local
